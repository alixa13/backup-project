[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netsec-ml"
version = "0.1.0"
description = "CPU-only training project for the Network Security ML Platform. Consumes canonical Java/Flink feature vectors only; never reimplements Zeek parsing or feature extraction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

# Step 1 scope: dependency list only, no implementation. Versions are pinned
# starting at Roadmap.md Day 6-8 (dataset snapshot, training, ONNX export).
dependencies = [
    "scikit-learn",
    "skl2onnx",
    "onnxruntime",
    "clickhouse-connect",
    "pyarrow",
    "pyyaml",
]

[project.optional-dependencies]
# The S7comm Stage 1 detector v2 (docs/superpowers/specs/2026-09-28-s7comm-detector-v2-design.md).
# torch comes from the CPU index first (see training/README.md); this pin only records it.
s7comm = [
    "torch==2.5.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "pyyaml>=6.0",
]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
