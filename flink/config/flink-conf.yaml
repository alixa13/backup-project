# Flink Configuration

# Common configurations
jobmanager.rpc.address: flink
# Set taskmanager.numberOfTaskSlots high for heavy parallelism
taskmanager.numberOfTaskSlots: 96
rest.address: 0.0.0.0
rest.port: 8081
blob.server.port: 6124
query.server.port: 6125

# Memory configurations - Optimized for 32GB total allocation
# JobManager: 8GB, TaskManager: 24GB (with 16 slots = 1.5GB per slot)
jobmanager.memory.process.size: 8192m
taskmanager.memory.process.size: 24576m
taskmanager.memory.managed.size: 2048m
taskmanager.memory.jvm-metaspace.size: 2048m
taskmanager.memory.jvm-overhead.min: 1g
taskmanager.memory.jvm-overhead.max: 4g
taskmanager.memory.network.min: 512m
taskmanager.memory.network.max: 4g
taskmanager.memory.framework.heap.size: 1024m
taskmanager.memory.framework.off-heap.size: 1024m
jobmanager.memory.jvm-metaspace.size: 2048m
jobmanager.memory.jvm-overhead.min: 1g
jobmanager.memory.jvm-overhead.max: 4g
jobmanager.memory.heap.size: 4096m
jobmanager.memory.off-heap.size: 1024m

# Checkpointing configurations - DISABLED
# state.backend: filesystem
# state.checkpoints.dir: file:///opt/flink/checkpoints
# state.savepoints.dir: file:///opt/flink/savepoints
# execution.checkpointing.interval: 120000
# execution.checkpointing.mode: EXACTLY_ONCE
# execution.checkpointing.timeout: 300000

# Fault tolerance - More resilient restart strategy
restart-strategy: fixed-delay
restart-strategy.fixed-delay.attempts: 10
restart-strategy.fixed-delay.delay: 30s

# Logging
env.log.dir: /opt/flink/log 