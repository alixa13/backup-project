        limits:
          memory: 53G
        reservations:
          cpus: '50'
          memory: 31G

  # ── INFRA (CPU reservations only, soft sharing) ─────────────────────────

  zookeeper:
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  kafka:
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          cpus: '6'
          memory: 5G

  supervised:
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          cpus: '2'
          memory: 1G

  postgres:
    environment:
      POSTGRES_SHARED_BUFFERS: '2560MB'
      POSTGRES_EFFECTIVE_CACHE_SIZE: '7680MB'
      POSTGRES_WORK_MEM: '204MB'
    command:
      - postgres
      - -c
      - shared_buffers=2560MB
      - -c
      - effective_cache_size=7680MB
      - -c
      - work_mem=204MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=200
      - -c
      - wal_buffers=32MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=300
      - -c
      - synchronous_commit=off
      - -c
      - wal_writer_delay=10ms
      - -c
      - commit_delay=100
      - -c
      - commit_siblings=5
    deploy:
      resources:
        limits:
          memory: 10G
        reservations:
          cpus: '5'
          memory: 7G
