version: '3.8'

services:
##################################################

  flink:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: flink
    restart: unless-stopped
    ports:
      - "8081:8081"
    command: ["/bin/bash", "-c", "/opt/flink/start-flink.sh"]
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink
      - FLINK_CONF_DIR=/opt/flink/config
    networks:
      - anomaly-detection-network
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/jobs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    extra_hosts:
      - "kafka:172.18.0.1"
    volumes:
      - ./flink/jars/.:/opt/flink/jars
      - ./flink/config:/opt/flink/config
      # Checkpoints must outlive the container: without them the KafkaSource never
      # commits offsets and every restart replays the topic from the beginning.
      - flink-checkpoints:/opt/flink/checkpoints
    # CPU: reservations only (soft sharing); can use idle cores, yields when others need CPU
    deploy:
      resources:
        limits:
          memory: 28G
        reservations:
          cpus: '8'
          memory: 20G
##################################################
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - anomaly-detection-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Kafka
  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Explicitly configure listeners so the container doesn't need to talk to the host Docker daemon
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CREATE_TOPICS: "zeek-conn:16:1,zeek-http:16:1,zeek-dns:16:1,zeek-ssl:16:1,malicious-conn:16:1,malicious-http:16:1,malicious-dns:16:1,malicious-ssl:16:1,supervised-unsw42:16:1"
    depends_on:
      - zookeeper
    networks:
      - anomaly-detection-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          cpus: '2'
          memory: 2G

  # Zeek network analyzer
  # Note: Uses host network mode, resource limits may not apply properly
  zeek:
    build:
      context: ./zeek
      dockerfile: Dockerfile
    container_name: zeek
    network_mode: "host"
    volumes:
      - ./zeek/zeek-config/.:/usr/local/zeek/share/zeek/site/
      - ./zeek/zeek-etc/node.cfg:/usr/local/zeek/etc/node.cfg
    command: bash -c "zeekctl deploy && zeek -C -i veth1"
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:9092
    extra_hosts:
      - "kafka:172.18.0.1"
##################################################

  # Supervised ML API (7-class ids_best + legacy joblib baked into image)
  supervised:
    build:
      context: ./supervised
      dockerfile: API/Dockerfile
    container_name: supervised
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/models
      TRUSTED_IPS_PATH: /app/models/trusted_ips.txt
      HOST: "0.0.0.0"
      PORT: 8000
      DEBUG: "False"
    volumes:
      # Mount trusted IPs; ensure the file exists: touch flink/config/trusted_ips.txt
      - ./flink/config/trusted_ips.txt:/app/models/trusted_ips.txt
    networks:
      - anomaly-detection-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  # PostgreSQL Database for LSTM Autoencoder
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: lstm_db
      POSTGRES_USER: lstm_user
      POSTGRES_PASSWORD: lstm_password
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
      # Performance tuning for high write throughput
      POSTGRES_SHARED_BUFFERS: "256MB"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "1GB"
      POSTGRES_WORK_MEM: "16MB"
      POSTGRES_MAINTENANCE_WORK_MEM: "128MB"
      POSTGRES_MAX_CONNECTIONS: "200"
      POSTGRES_WAL_BUFFERS: "16MB"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - anomaly-detection-network
    command: 
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "wal_buffers=32MB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=300"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "wal_writer_delay=10ms"
      - "-c"
      - "commit_delay=100"
      - "-c"
      - "commit_siblings=5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lstm_user -d lstm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          cpus: '2'
          memory: 4G

  # LSTM Autoencoder for Unsupervised ML
  # This service receives data through Flink jobs only
  lstm-autoencoder:
    build:
      context: ./lstm-autoencoder
      dockerfile: Dockerfile
    container_name: lstm-autoencoder
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MODEL_PATH: /app/models
      HOST: "0.0.0.0"
      PORT: 5000
      DEBUG: "False"
      # PostgreSQL connection settings
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "lstm_db"
      DB_USER: "lstm_user"
      DB_PASSWORD: "lstm_password"
      # Connection pool: 80 connections (16 workers × 5 connections per worker)
      DB_POOL_SIZE: "40"
      DB_MAX_OVERFLOW: "80"
      # CPU-only: no GPU in container (avoids cuInit / CUDA 303 errors in logs)
      CUDA_VISIBLE_DEVICES: ""
      TF_CPP_MIN_LOG_LEVEL: "3"
      # Anomaly threshold = mean + N*std of held-out reconstruction error.
      # 3 detects ~22% of anomalies at ~0% false positives; 2 detects ~57% at ~1.4%.
      ANOMALY_THRESHOLD_SIGMA: "3.0"
      # How far live traffic may pull the adaptive threshold from that baseline.
      ADAPTIVE_MAX_DRIFT_FACTOR: "2.0"
      # Worker/thread counts: set by configure-resources.sh override (GUNICORN_WORKERS + TF_*).
      # Must stay 1: the API holds per-process state (adaptive threshold window, training
      # queue, buffer status). See configure-resources.sh for the full reasoning.
      GUNICORN_WORKERS: "1"
    volumes:
      - lstm-models:/app/models
      - lstm-data:/app/data
      - ./lstm-autoencoder/app:/app/app
    networks:
      - anomaly-detection-network
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # CPU: reservations only (no hard limit). Uses idle cores when training, yields when others need CPU.
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          cpus: '16'
          memory: 12G

networks:
  anomaly-detection-network:
    driver: bridge

volumes:
  supervised-models:
    driver: local
  lstm-models:
    driver: local
  lstm-data:
    driver: local
  postgres-data:
    driver: local
  flink-checkpoints:
    driver: local
