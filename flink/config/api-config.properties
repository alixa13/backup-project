# API Configuration for Flink Jobs
# This file contains API URLs used in the Flink Java classes

# Supervised ML API URLs (UNSW-NB15 42-feature only)
supervised.api.base.url=http://supervised:8000
supervised.api.unsw42.endpoint=/predict_unsw42

# Unsupervised ML API URLs 
# Note: The unsupervised ML system independently connects to Kafka 
# and does not depend on Flink. Flink only requests results via these APIs.
unsupervised.api.base.url=http://lstm-autoencoder:5000
unsupervised.api.conn.learning.status=/learning/status/conn
unsupervised.api.http.learning.status=/learning/status/http
unsupervised.api.dns.learning.status=/learning/status/dns
unsupervised.api.ssl.learning.status=/learning/status/ssl
unsupervised.api.conn.learning.enable=/learning/enable/conn
unsupervised.api.http.learning.enable=/learning/enable/http
unsupervised.api.dns.learning.enable=/learning/enable/dns
unsupervised.api.ssl.learning.enable=/learning/enable/ssl
unsupervised.api.conn.learning.disable=/learning/disable/conn
unsupervised.api.http.learning.disable=/learning/disable/http
unsupervised.api.dns.learning.disable=/learning/disable/dns
unsupervised.api.ssl.learning.disable=/learning/disable/ssl
unsupervised.api.conn.predict=/predict/conn
unsupervised.api.http.predict=/predict/http
unsupervised.api.dns.predict=/predict/dns
unsupervised.api.ssl.predict=/predict/ssl
unsupervised.api.conn.buffer.update=/buffer/update/conn
unsupervised.api.http.buffer.update=/buffer/update/http
unsupervised.api.dns.buffer.update=/buffer/update/dns
unsupervised.api.ssl.buffer.update=/buffer/update/ssl
unsupervised.api.conn.threshold=/threshold/conn
unsupervised.api.http.threshold=/threshold/http
unsupervised.api.dns.threshold=/threshold/dns
unsupervised.api.ssl.threshold=/threshold/ssl
unsupervised.api.kafka.start=/kafka/start
unsupervised.api.kafka.stop=/kafka/stop

# API Connection Settings
# NOTE: retries run on a Flink task thread and block it. Worst-case stall per record
# is roughly retry.count * read.timeout + the capped backoff sleeps, so keep both small.
# The previous retry.count=10 with an uncapped 2^n backoff could sleep 1022s on one record.
api.connection.timeout=60000
# 30s, not 120s: this timeout is spent on a Flink task thread. Worst-case stall per
# record is retry.count * read.timeout + backoff = 3*30s + 1.5s ~= 92s, which has to
# stay under execution.checkpointing.timeout in flink-conf.yaml (180s).
api.read.timeout=30000
api.retry.count=3
api.retry.delay=500
api.retry.backoff.max.ms=4000

# Kafka Configuration
# Note: These settings are used by Flink. The unsupervised ML system 
# has its own direct connection to Kafka configured separately.
kafka.bootstrap.servers=kafka:9092
kafka.auto.offset.reset=earliest
kafka.enable.auto.commit=false
kafka.max.poll.records=100
kafka.max.poll.interval.ms=600000
kafka.session.timeout.ms=120000
kafka.heartbeat.interval.ms=30000

# Kafka Consumer Group IDs - Used by Flink only
kafka.consumer.group.conn=flink-consumer-group-conn
kafka.consumer.group.http=flink-consumer-group-http
kafka.consumer.group.dns=flink-consumer-group-dns
kafka.consumer.group.ssl=flink-consumer-group-ssl

# Kafka Topic Names
# These topics are read by both Flink and the unsupervised ML system independently
kafka.topic.conn=zeek-conn
kafka.topic.http=zeek-http
kafka.topic.dns=zeek-dns
kafka.topic.ssl=zeek-ssl

# Kafka output topics for malicious traffic
kafka.topic.malicious.conn=malicious-conn
kafka.topic.malicious.http=malicious-http
kafka.topic.malicious.dns=malicious-dns
kafka.topic.malicious.ssl=malicious-ssl

# Supervised output topic (UnifiedSupervisedFlinkJob)
kafka.topic.supervised.unsw42=supervised-unsw42