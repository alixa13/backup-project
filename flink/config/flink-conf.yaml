# Flink Configuration — GENERATED from configure-resources.sh
# Do not edit this file by hand. Edit flink-conf.yaml.template and re-run configure-resources.sh.
# Slot count is set in configure-resources.sh (FLINK_TM_SLOTS). Must be >= 80 (16 + 4×16).
# Memory is derived from allocated Flink container memory (JobManager 4G, rest to TaskManager).

# Common
jobmanager.rpc.address: flink
taskmanager.numberOfTaskSlots: 80
rest.address: 0.0.0.0
rest.port: 8081
blob.server.port: 6124
query.server.port: 6125

# Memory — filled by configure-resources.sh from allocation (FLINK_JM_MEM_MB, FLINK_TM_MEM_MB)
jobmanager.memory.process.size: 4096m
jobmanager.memory.heap.size: 2048m
jobmanager.memory.off-heap.size: 512m
jobmanager.memory.jvm-metaspace.size: 512m
jobmanager.memory.jvm-overhead.min: 512m
jobmanager.memory.jvm-overhead.max: 1g

taskmanager.memory.process.size: 37888m
taskmanager.memory.managed.size: 2048m
taskmanager.memory.jvm-metaspace.size: 1024m
taskmanager.memory.jvm-overhead.min: 1g
taskmanager.memory.jvm-overhead.max: 4g
taskmanager.memory.network.min: 512m
taskmanager.memory.network.max: 8g
taskmanager.memory.framework.heap.size: 1024m
taskmanager.memory.framework.off-heap.size: 2g

# Checkpointing
#
# This was disabled because checkpoints timed out. The cause was blocking HTTP inside
# the operator: api.retry.count was 10 with an uncapped 2^n backoff, so one record could
# hold a task thread for ~17 minutes and no 60s checkpoint could ever complete. That is
# now bounded (3 retries, 30s read timeout, 4s backoff cap => ~92s worst case), so the
# timeout below is set above it with room to spare.
#
# Without checkpoints the KafkaSource never committed offsets (enable.auto.commit=false)
# and every job restart replayed the whole topic from the earliest offset, re-alerting on
# the entire backlog. The keyed state in the supervised job was also lost on every restart.
state.backend: hashmap
state.checkpoints.dir: file:///opt/flink/checkpoints
state.checkpoints.num-retained: 3
execution.checkpointing.interval: 60000
execution.checkpointing.mode: AT_LEAST_ONCE
execution.checkpointing.timeout: 180000
execution.checkpointing.max-concurrent-checkpoints: 1
execution.checkpointing.min-pause: 30000
execution.checkpointing.unaligned: true
execution.checkpointing.tolerable-failed-checkpoints: 3

# Restart
restart-strategy: fixed-delay
restart-strategy.fixed-delay.attempts: 10
restart-strategy.fixed-delay.delay: 30s

# Logging (log4j.properties/log4j-console.properties and log4j2.xml live in this dir)
env.log.dir: /opt/flink/log

# JVM: allow Netty/java.nio reflective access (removes illegal reflective access warning); give Log4j2 a config path (fixes StatusLogger "No configuration found at 'null'")
env.java.opts: -XX:+IgnoreUnrecognizedVMOptions --add-opens=java.base/java.nio=ALL-UNNAMED -Dlog4j.configurationFile=file:/opt/flink/config/log4j2.xml

# Release dead/unregistered TaskManagers sooner so REST UI does not reference stale TM IDs (reduces UnknownTaskExecutorException when clicking old TM links)
resourcemanager.taskmanager-timeout: 20000
